<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangar 700 Records | Virtual DJ Deck</title>
  <style>
    body { background: #0b0c10; color: #66fcf1; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #ff007f; text-shadow: 0 0 10px #ff007f; letter-spacing: 2px; }
    .console { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
    .deck { border: 2px solid #45a29e; border-radius: 10px; padding: 20px; width: 320px; background: #1f2833; box-shadow: 0 0 15px rgba(102, 252, 241, 0.2); }
    .deck h2 { color: #c5c6c7; border-bottom: 1px solid #45a29e; padding-bottom: 5px; }
    audio { width: 100%; margin-top: 15px; }
    .crossfader-box { margin-top: 30px; border: 1px solid #ff007f; padding: 15px; border-radius: 8px; background: #121212; }
    input[type=range] { width: 80%; accent-color: #ff007f; }
  </style>
</head>
<body>
  <h1>HANGAR 700 VIRTUAL DJ LOUNGE</h1>
  <p>432Hz Baseline Retuned | 12kHz Air Protocol Active</p>

  <div class="console">
    <div class="deck" id="deck-a">
      <h2>DECK A</h2>
      <audio id="audioA" controls src="../mastered_HIGHWAY OF THE BROKEN HEART.flac"></audio>
    </div>

    <div class="deck" id="deck-b">
      <h2>DECK B</h2>
      <audio id="audioB" controls src="../mastered_Rest in the Frequency.flac"></audio>
    </div>
  </div>

  <div class="crossfader-box">
    <h3>MASTER CROSSFADER</h3>
    <input type="range" id="crossfader" min="0" max="100" value="50">
  </div>

  <script>
    const audioA = document.getElementById('audioA');
    const audioB = document.getElementById('audioB');
    const fader = document.getElementById('crossfader');

    fader.addEventListener('input', (e) => {
      const val = e.target.value / 100;
      audioA.volume = 1 - val;
      audioB.volume = val;
    });
  </script>
</body>
</html>
